# Render blueprint for the Haven AI backend.
#
# Because the image needs gitignored files (~1 GB: the interior ONNX model and
# Poly Haven assets), the recommended flow is to build the image locally and
# push it to a registry, then deploy that image here (set `image.url` and remove
# the `dockerfilePath` line). The dockerfilePath form below works too, but only
# if those large files are made available to Render's builder (e.g. committed
# via Git LFS) — otherwise Interior Design and 3D texturing fail at runtime.
#
# Secrets (GEMINI_API_KEY, SMTP_*) are marked sync:false — set their values in
# the Render dashboard, never in this file. The Firebase service-account key is
# added as a Render "Secret File" named firebase-credentials.json (it mounts at
# /etc/secrets/firebase-credentials.json), which FIREBASE_CREDS_PATH points to.

services:
  - type: web
    name: haven-ai-backend
    runtime: docker
    dockerfilePath: ./haven-ai-backend/Dockerfile
    dockerContext: ./haven-ai-backend
    plan: starter            # free tier lacks the RAM/disk for the ML deps
    region: singapore        # closest Render region to Pakistan/South Asia
    healthCheckPath: /api/health
    numInstances: 1          # reset codes + interior scenes are per-instance
    disk:
      name: haven-storage
      mountPath: /app/storage   # interior design scenes survive restarts
      sizeGB: 2
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      # The backend loads the Firebase key from this file path. Add the key as a
      # Render Secret File named firebase-credentials.json (see DEPLOYMENT.md).
      - key: FIREBASE_CREDS_PATH
        value: /etc/secrets/firebase-credentials.json
      - key: CORS_ORIGINS
        sync: false          # e.g. https://your-frontend.vercel.app
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: DESIGN3D_TEXT_GENERATOR
        value: gemini
      - key: PLAN_ANALYZER
        value: gemini
      - key: DESIGN3D_PHOTO_ANALYZER
        value: gemini
      - key: RESET_CODE_LOG_ONLY
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ZAMEEN_API_URL
        sync: false
      - key: ZAMEEN_API_KEY
        sync: false
